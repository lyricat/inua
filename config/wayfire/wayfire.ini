# Inua on Wayfire: the sample config. Choosing Wayfire in inua's settings
# (Compositor) writes it to ~/.config/wayfire.ini when you have none. The
# keyboard, touchpad, shortcut and display settings made in inua are
# applied over the IPC each time the shell starts and are not written
# here; a shortcut bound below stays bound beside one set in inua, so
# delete its two lines when you move it, and an [output:NAME] section
# here is what a display falls back to when inua no longer sets it.
#
# inua talks to Wayfire through its IPC plugins, so ipc and ipc-rules
# must stay in the plugin list, with vswitch for the workspaces,
# wm-actions for fullscreen and command for the shortcuts; what is
# missing shows in inua as not available. Wayfire has no blur behind
# inua's surfaces here and no live previews in the overview:
# docs/compositor-capabilities.md says what is there. It runs on Wayfire
# 0.9 (Debian 13) and later; see docs/compositor-experiments.md.

[core]
# ipc first, as Wayfire asks. session-lock is the lock screen's protocol,
# foreign-toplevel what docks and task lists read.
plugins = ipc ipc-rules vswitch wsets command wm-actions foreign-toplevel session-lock place move resize decoration autostart idle
vwidth = 3
vheight = 3
preferred_decoration_mode = server
close_top_view = <super> KEY_Q

[autostart]
# inua draws the wallpaper, shows notifications, locks the screen and asks
# for administrator passwords itself.
autostart_wf_shell = false
inua = inua-shell
fcitx = sh -c 'command -v fcitx5 >/dev/null && fcitx5 -d --replace'

[vswitch]
binding_left = <super> KEY_LEFT
binding_right = <super> KEY_RIGHT
binding_up = <super> KEY_UP
binding_down = <super> KEY_DOWN
with_win_left = <super> <shift> KEY_LEFT
with_win_right = <super> <shift> KEY_RIGHT
with_win_up = <super> <shift> KEY_UP
with_win_down = <super> <shift> KEY_DOWN

[wm-actions]
toggle_fullscreen = <super> KEY_F

[command]
# Launcher: apps; windows (focus order, Enter switches to the previous one).
binding_launcher = <super> KEY_SPACE
command_launcher = inua call launcher toggle
# Overview: choose a workspace or one of its windows.
binding_overview = <super> KEY_TAB
command_overview = inua call overview toggle
# Control center, notification center, inua's settings.
binding_control = <super> KEY_A
command_control = inua call control toggle
binding_notifications = <super> KEY_N
command_notifications = inua call notifications toggle
binding_settings = <super> KEY_COMMA
command_settings = inua call settings toggle
# Restart the shell, e.g. after editing its config or rebuilding it.
binding_restart = <super> <shift> KEY_R
command_restart = inua call shell restart
# Lock the screen.
binding_lock = <super> KEY_L
command_lock = inua call lock now

binding_terminal = <super> KEY_ENTER
command_terminal = inua-term
binding_files = <super> KEY_E
command_files = inua-files

binding_shot_area = KEY_SYSRQ
command_shot_area = inua call screenshot silent-area
binding_shot_pick = <ctrl> KEY_SYSRQ
command_shot_pick = inua call screenshot area
binding_shot_screen = <shift> KEY_SYSRQ
command_shot_screen = inua call screenshot screen

repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = brightnessctl -e4 -n2 set 5%+
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = brightnessctl -e4 -n2 set 5%-
