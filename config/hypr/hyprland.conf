# Bootstrap Hyprland config for inua (Hyprland 0.53).
# Copy to ~/.config/hypr/hyprland.conf, then check it with
#   Hyprland --verify-config -c ~/.config/hypr/hyprland.conf
# Reference: https://wiki.hypr.land/0.53.0/Configuring/
#
# Companion programs are started only if installed, so this works on a bare
# system. On Ubuntu 26.04, `make deps deps-desktop` installs inua's needs and
# everything referenced here; docs/design.md lists each package and what it is for.
# inua-shell and inua must be on PATH (`make` builds them into bin/).

# --- monitors --------------------------------------------------------------

# Every monitor at its preferred mode, placed automatically. Add lines like
#   monitor = eDP-1, 2560x1600@120, 0x0, 1.6
# for specific ones (`hyprctl monitors` lists names).
monitor = , preferred, auto, auto

# --- programs ---------------------------------------------------------------

$terminal = inua terminal  # the one chosen in Settings, Default Apps
$files = inua-files

# --- environment ------------------------------------------------------------

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
# Tells portals and apps which desktop this is.
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
# Toolkits: prefer Wayland, fall back to X11.
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = SDL_VIDEODRIVER, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
# ssh asks for a passphrase in inua's dialog when it has no terminal (git
# GUIs, editors, Ansible).
env = SSH_ASKPASS, inua-askpass
# Chinese input with Fcitx 5 (remove if you do not use an input method).
# Leave GTK_IM_MODULE unset: GTK reaches Fcitx through Wayland text-input.
env = XMODIFIERS, @im=fcitx
env = QT_IM_MODULE, fcitx

# --- autostart --------------------------------------------------------------

# Make the session environment visible to D-Bus activated services and
# systemd user units (portals, keyring).
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE

# The shell: wallpaper, bars, launcher, control center, notifications, tray.
# Its settings are in ~/.config/inua/config.toml (Super+Comma edits them).
exec-once = inua-shell

# inua-shell shows notifications itself. To use mako (or another daemon)
# instead, set [notifications] enable = false in config.toml and start it
# here: exec-once = mako
# Lock after idle; configure in ~/.config/hypr/hypridle.conf.
exec-once = command -v hypridle >/dev/null && hypridle
# inua-shell asks for passwords for administrative actions itself (it is
# the session's polkit agent). Another agent started here would take that
# over: exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
# Input method.
exec-once = command -v fcitx5 >/dev/null && fcitx5 -d --replace

# --- look -------------------------------------------------------------------

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, almostLinear, popin 87%
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, almostLinear, fade
    animation = workspaces, 1, 1.94, almostLinear, fade
}

# The shell's surfaces are translucent; blur what is behind them. These are
# the layer-shell namespaces it uses (inua-center is the notification
# center, inua-banners its banners, inua-calendar the calendar panel under
# the clock, inua-dock the app dock, inua-osd the volume and brightness indicator).
layerrule {
    name = inua-blur
    match:namespace = ^inua-(bar|launcher|control|calendar|center|banners|dock|osd)$
    blur = on
    # Above the shadows and the control backdrop (under 0.5), below the
    # surfaces themselves (0.84 and up), so shadows are not blurred.
    ignore_alpha = 0.6
}

# The wallpaper should not fade in and out like a window.
layerrule {
    name = inua-background
    match:namespace = ^inua-background$
    no_anim = on
}

# The control center, calendar panel, notification center, banners, dock,
# level indicator and launcher animate themselves.
layerrule {
    name = inua-no-anim
    match:namespace = ^inua-(launcher|control|calendar|center|banners|dock|osd)$
    no_anim = on
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

ecosystem {
    no_update_news = true
}

# --- input ------------------------------------------------------------------

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# Three-finger swipe switches workspaces.
gesture = 3, horizontal, workspace

# --- shell key bindings -----------------------------------------------------

$mod = SUPER

# Launcher: apps; windows (focus order, Enter switches to the previous one).
bind = $mod, Space, exec, inua call launcher toggle
# Overview: choose a workspace or one of its windows.
bind = $mod, Tab, exec, inua call overview toggle
# Control center, notification center (also the bell in the bar), and
# inua's settings.
bind = $mod, A, exec, inua call control toggle
bind = $mod, N, exec, inua call notifications toggle
bind = $mod, comma, exec, inua call settings toggle
# Restart the shell, e.g. after editing its config or rebuilding it.
bind = $mod SHIFT, R, exec, inua call shell restart
# Lock the screen.
bind = $mod, L, exec, inua call lock now

# --- window management ------------------------------------------------------

bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $files
bind = $mod, Q, killactive,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod SHIFT, E, exec, hyprctl dispatch exit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scratchpad.
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots: pick an area, a window or a screen; the whole screen at once.
bind = , Print, exec, inua call screenshot silent-area
bind = CTRL, Print, exec, inua call screenshot area
bind = SHIFT, Print, exec, inua call screenshot screen

# --- media keys -------------------------------------------------------------

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# --- window rules -----------------------------------------------------------

# Apps should not maximize themselves over the tiling layout.
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Keep XWayland drag-and-drop helper windows from taking focus.
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# inua's settings window floats at its own size.
windowrule {
    name = inua-settings
    match:class = ^io\.github\.lyricat\.Inua$
    float = on
    size = 860 620
    center = on
}

# --- inua settings ---------------------------------------------------------

# Keyboard and touchpad settings from inua's settings window, written by
# inua from ~/.config/inua/config.toml. Keep this last: Hyprland applies
# settings in order, so lines after it would override inua's.
source = ./inua.conf
