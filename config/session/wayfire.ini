# Minimal Wayfire 0.9 / wlroots 0.18 profile for Inua.
[core]
plugins = ipc ipc-rules foreign-toplevel vswitch oswitch wm-actions window-rules move resize decoration place autostart command session-lock idle switcher fast-switcher alpha wayfire-shell input-method-v1 grid
xwayland = true
preferred_decoration_mode = server
vwidth = 3
vheight = 3

[input]
modifier_binding_timeout = 400

[autostart]
autostart_wf_shell = false
autostart_inua_shell = inua-shell -n wayfire

[command]
binding_inua_overview = <super> KEY_TAB
command_inua_overview = inua call overview toggle
binding_inua_voice = <super> <shift> KEY_V
command_inua_voice = inua call voice start
release_binding_inua_voice_release = <super> <shift> KEY_V
command_inua_voice_release = inua call voice stop
binding_voxtype_hold = F24
command_voxtype_hold = true
release_binding_voxtype_release = F24
command_voxtype_release = true
binding_inua_launcher = <super> KEY_SPACE
command_inua_launcher = inua call launcher toggle
binding_inua_control = <super> KEY_A
command_inua_control = inua call control toggle
binding_inua_notifications = <super> KEY_N
command_inua_notifications = inua call notifications toggle
binding_inua_lock = <super> KEY_L
command_inua_lock = inua call lock now
binding_inua_settings = <super> KEY_COMMA
command_inua_settings = inua call settings toggle
binding_inua_shot = <super> KEY_S
command_inua_shot = inua call screenshot silent-area
binding_inua_close = <super> KEY_Q
command_inua_close = inua call window close
binding_voxtype_toggle = KEY_F9
command_voxtype_toggle = voxtype record toggle
binding_shot_monitor = <ctrl> <shift> KEY_PRINT
command_shot_monitor = nixarchy-screenshot-active-monitor
binding_shot_delayed = <shift> KEY_PRINT
command_shot_delayed = omarchy-delayed-screenshot 3
binding_shot_delayed_full = <ctrl> <shift> KEY_F3
command_shot_delayed_full = omarchy-delayed-screenshot 3 fullscreen
binding_move_1 = <super> <shift> KEY_1
command_move_1 = inua call window move 1
binding_send_1 = <super> <shift> <alt> KEY_1
command_send_1 = inua call window send 1
binding_move_2 = <super> <shift> KEY_2
command_move_2 = inua call window move 2
binding_send_2 = <super> <shift> <alt> KEY_2
command_send_2 = inua call window send 2
binding_move_3 = <super> <shift> KEY_3
command_move_3 = inua call window move 3
binding_send_3 = <super> <shift> <alt> KEY_3
command_send_3 = inua call window send 3
binding_move_4 = <super> <shift> KEY_4
command_move_4 = inua call window move 4
binding_send_4 = <super> <shift> <alt> KEY_4
command_send_4 = inua call window send 4
binding_move_5 = <super> <shift> KEY_5
command_move_5 = inua call window move 5
binding_send_5 = <super> <shift> <alt> KEY_5
command_send_5 = inua call window send 5
binding_move_6 = <super> <shift> KEY_6
command_move_6 = inua call window move 6
binding_send_6 = <super> <shift> <alt> KEY_6
command_send_6 = inua call window send 6
binding_move_7 = <super> <shift> KEY_7
command_move_7 = inua call window move 7
binding_send_7 = <super> <shift> <alt> KEY_7
command_send_7 = inua call window send 7
binding_move_8 = <super> <shift> KEY_8
command_move_8 = inua call window move 8
binding_send_8 = <super> <shift> <alt> KEY_8
command_send_8 = inua call window send 8
binding_move_9 = <super> <shift> KEY_9
command_move_9 = inua call window move 9
binding_send_9 = <super> <shift> <alt> KEY_9
command_send_9 = inua call window send 9

[wm-actions]
toggle_maximize = <super> KEY_F

[grid]
slot_tl = <super> KEY_1
slot_t = <super> KEY_2
slot_tr = <super> KEY_3
slot_l = <super> KEY_4
slot_c = <super> KEY_5
slot_r = <super> KEY_6
slot_bl = <super> KEY_7
slot_b = <super> KEY_8
slot_br = <super> KEY_9

[move]
activate = <alt> BTN_LEFT

[resize]
activate = <alt> BTN_RIGHT
