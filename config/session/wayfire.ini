# Minimal Wayfire 0.9 / wlroots 0.18 profile for Inua.
# The plugin list is a whitelist. No cube, wobbly, blur, fisheye, zoom,
# expo, invert or animate effects are loaded.
[core]
plugins = ipc ipc-rules foreign-toplevel vswitch oswitch wm-actions window-rules move resize decoration place autostart command session-lock idle switcher fast-switcher alpha wayfire-shell
xwayland = true
preferred_decoration_mode = server
vwidth = 3
vheight = 3

[input]
# Wayfire uses this for modifier-only bindings; test that Super tap does not
# steal Super+key chords. Zero disables the timeout.
modifier_binding_timeout = 400

[output:HEADLESS-1]
mode = 1920x1080@60000
position = 0,0
scale = 1.000000

[autostart]
autostart_wf_shell = false

[command]
bindings_inua_overview = <super> : inua call overview toggle
