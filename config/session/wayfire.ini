# Minimal Wayfire 0.9 / wlroots 0.18 profile for Inua.
[core]
plugins = ipc ipc-rules foreign-toplevel vswitch oswitch wm-actions window-rules move resize decoration place autostart command session-lock idle switcher fast-switcher alpha wayfire-shell input-method-v1
xwayland = true
preferred_decoration_mode = server
vwidth = 1
vheight = 1

[input]
modifier_binding_timeout = 400

[autostart]
autostart_wf_shell = false
autostart_inua_shell = inua-shell -n wayfire

[command]
binding_inua_overview = <super> KEY_TAB
command_inua_overview = inua call overview toggle
binding_inua_voice = <super> <shift> KEY_V
command_inua_voice = inua call voice start
release_binding_inua_voice_release = <super> <shift> KEY_V
command_inua_voice_release = inua call voice stop
binding_voxtype_hold = KEY_F24
command_voxtype_hold = true
release_binding_voxtype_release = KEY_F24
command_voxtype_release = true
binding_inua_launcher = <super> KEY_SPACE
command_inua_launcher = inua call launcher toggle
binding_inua_control = <super> KEY_A
command_inua_control = inua call control toggle
binding_inua_notifications = <super> KEY_N
command_inua_notifications = inua call notifications toggle
binding_inua_lock = <super> KEY_L
command_inua_lock = inua call lock now
binding_inua_settings = <super> KEY_COMMA
command_inua_settings = inua call settings toggle
binding_inua_shot = <super> KEY_S
command_inua_shot = inua call screenshot silent-area
binding_inua_close = <super> KEY_Q
command_inua_close = inua call window close
binding_voxtype_toggle = KEY_F9
command_voxtype_toggle = voxtype record toggle
binding_shot_monitor = <ctrl> <shift> KEY_PRINT
command_shot_monitor = nixarchy-screenshot-active-monitor
binding_shot_delayed = <shift> KEY_PRINT
command_shot_delayed = omarchy-delayed-screenshot 3
binding_shot_delayed_full = <ctrl> <shift> KEY_F3
command_shot_delayed_full = omarchy-delayed-screenshot 3 fullscreen

[wm-actions]
toggle_maximize = <super> KEY_F

[move]
activate = <alt> BTN_LEFT

[resize]
activate = <alt> BTN_RIGHT
