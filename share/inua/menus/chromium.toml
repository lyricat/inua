# Chromium and Chrome draw their own menu bar. On XWayland they publish it
# on their bus name (/com/canonical/menu), and the bar reads it. Running
# natively on Wayland they publish neither that nor an accessibility menu,
# so this pack sends their Linux default shortcuts instead
# (chrome://settings/keyboardShortcuts). Commands without a default
# shortcut are shown disabled.
id = "chromium"
match = ["chromium", "chromium-browser", "chrome", "google-chrome", "google-chrome-stable", "google-chrome-beta", "google-chrome-unstable", "com.google.Chrome", "org.chromium.Chromium"]
skip_a11y = true

[[section]]
label = "File"

[[section.item]]
label = "New Tab"
keys = ["CTRL", "T"]

[[section.item]]
label = "New Window"
keys = ["CTRL", "N"]

[[section.item]]
label = "New Incognito Window"
keys = ["CTRL", "SHIFT", "N"]

[[section.item]]
label = "Open File…"
keys = ["CTRL", "O"]

[[section.item]]
separator = true

[[section.item]]
label = "Save Page As…"
keys = ["CTRL", "S"]

[[section.item]]
label = "Print…"
keys = ["CTRL", "P"]

[[section.item]]
separator = true

[[section.item]]
label = "Close Window"
keys = ["CTRL", "SHIFT", "W"]

[[section.item]]
