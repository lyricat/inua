# Zed draws its own menu bar (Zed, File, Edit, Selection, View, Go, Run,
# Window, Help) and exports nothing on the accessibility bus and no menu of
# its own over D-Bus, so the bar cannot read it. This pack follows Zed's
# menus (crates/zed/src/zed/app_menus.rs, Zed 1.25) and the Linux default
# keymap (assets/keymaps/default-linux.json). An item can only send keys, so
# commands with no default shortcut are shown disabled rather than left out.
# A remapped keymap, another base_keymap, or vim_mode changes what a key
# does; the package keeps Zed's defaults.
id = "zed"
match = ["dev.zed.Zed", "zed", "zeditor"]
skip_a11y = true

