# VS Code draws its menu itself and exposes only an overflow item on the
# accessibility bus, which would be a menu that cannot be used. skip_a11y
# records that; the shell does not read accessibility menus yet, so the
# flag has no effect, and with no sections the bar shows the generic menu.
id = "code"
match = ["code", "vscode"]
suffix = [".code"]
skip_a11y = true
