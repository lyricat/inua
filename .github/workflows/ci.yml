name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make python3 python3-gi dbus-daemon pass gnupg \
            gir1.2-secret-1 libturbojpeg0 hyprland \
            blueprint-compiler gir1.2-gtk-4.0
      - name: Go formatting
        run: |
          unformatted=$(git ls-files '*.go' ':!third_party' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Check generated layouts
        run: |
          make generate
          git add --intent-to-add -- ui/
          git diff --exit-code -- ui/
      - name: Check the translation template and catalogs
        run: |
          make i18n
          git diff --exit-code -- po/ internal/i18n/locales/
      - name: Tests and vet
        run: make test
      - name: Build all programs
        run: make build

  # inua-term's engine, built from Ghostty's pinned commit, and the tests
  # that need it (they are skipped without it above).
  term-engine:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc bash zsh dbus-daemon libgtk-4-1
      - name: Build the engine
        run: make term-engine
      - name: Tests with the engine
        run: CGO_ENABLED=1 go test -race ./internal/term/... ./internal/termui ./cmd/inua-term ./cmd/inua-termd

  # inua-termd on a Mac: the engine built there, the host and the web
  # page tested on macOS (docs/terminal.md, "On macOS").
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build the engine
        run: scripts/libghostty.sh
      - name: Build inua-termd
        run: go build -o bin/inua-termd ./cmd/inua-termd
      # macOS's own bash is 3.2, without PS0, which the shell
      # integration marks a command's start with.
      - name: A newer bash
        run: brew install bash
      - name: The host's tests
        run: go test ./cmd/inua-termd ./internal/term/agent ./internal/term/host ./internal/term/layout ./internal/term/model ./internal/term/pty ./internal/term/settings ./internal/term/shellint ./internal/term/vt ./internal/term/web ./internal/term/webterm
      # The window, as inua-term.app (docs/terminal.md, "On macOS"): built
      # with GTK inside it, nothing loaded from Homebrew, and it draws.
      - name: GTK for the app
        run: brew install gtk4 librsvg adwaita-icon-theme
      - name: The window's tests
        run: go test ./internal/termui ./cmd/inua-term ./internal/style
      - name: inua-term.app
        run: scripts/macos-app.sh
      - name: The app starts, on its own libraries
        run: |
          # Its standard error goes to its log once it starts: both read.
          home=$(mktemp -d)
          out=$(INUA_TERM_SMOKE=1 HOME=$home DYLD_PRINT_LIBRARIES=1 \
            /usr/bin/perl -e 'alarm 120; exec @ARGV' build/macos/inua-term.app/Contents/MacOS/inua-term 2>&1) || code=$?
          out="$out
          $(cat "$home/.local/state/inua/term.log" 2>/dev/null)"
          echo "$out" | grep -v 'dyld' || true
          if [ -n "${code:-}" ]; then
            echo "inua-term ended with $code" >&2
            exit 1
          fi
          if echo "$out" | grep 'dyld.*\(/opt/homebrew\|/usr/local\)'; then
            echo "loaded from Homebrew, not the bundle" >&2
            exit 1
          fi
          echo "$out" | grep -q 'a frame drawn'
      - uses: actions/upload-artifact@v4
        with:
          name: inua-term-macos
          path: build/macos/*.dmg
