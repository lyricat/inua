# Releases for Linux, amd64 and arm64, built by GitHub Actions on a tag
# (v0.1.2; .github/workflows/release.yml). Try it locally with
#   goreleaser release --snapshot --clean
version: 2
project_name: inua

before:
  hooks:
    - go vet ./...

builds:
  - &build
    id: inua-shell
    main: ./cmd/inua-shell
    binary: inua-shell
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - <<: *build
    id: inua
    main: ./cmd/inua
    binary: inua
  - <<: *build
    id: inua-apps
    main: ./cmd/inua-apps
    binary: inua-apps
  - <<: *build
    id: inua-files
    main: ./cmd/inua-files
    binary: inua-files
  - <<: *build
    id: inua-viewer
    main: ./cmd/inua-viewer
    binary: inua-viewer
  - <<: *build
    id: inua-vm
    main: ./cmd/inua-vm
    binary: inua-vm
  - <<: *build
    id: inua-remote
    main: ./cmd/inua-remote
    binary: inua-remote
  - <<: *build
    id: inua-connect
    main: ./cmd/inua-connect
    binary: inua-connect
  - <<: *build
    id: inua-disk-usage
    main: ./cmd/inua-disk-usage
    binary: inua-disk-usage
  - <<: *build
    id: inua-mail
    main: ./cmd/inua-mail
    binary: inua-mail
    # The Google client's secret comes from the release workflow's
    # INUA_GOOGLE_CLIENT_SECRET (a repository secret), not the source:
    # GitHub reports a GOCSPX secret found in a public repository to Google.
    ldflags:
      - -s -w -X main.version={{ .Version }}
      - -X github.com/lyricat/inua/internal/apps/mail.GoogleClientSecret={{ index .Env "INUA_GOOGLE_CLIENT_SECRET" }}
  - <<: *build
    id: inua-games
    main: ./cmd/inua-games
    binary: inua-games
  - <<: *build
    id: inua-pinentry
    main: ./cmd/inua-pinentry
    binary: inua-pinentry
  - <<: *build
    id: inua-askpass
    main: ./cmd/inua-askpass
    binary: inua-askpass
  - <<: *build
    id: inua-assistant
    main: ./cmd/inua-assistant
    binary: inua-assistant
  - <<: *build
    id: inua-keyring
    main: ./cmd/inua-keyring
    binary: inua-keyring
  - <<: *build
    id: inua-term
    main: ./cmd/inua-term
    binary: inua-term
  - <<: *build
    id: inua-termd
    main: ./cmd/inua-termd
    binary: inua-termd

archives:
  - formats: [tar.gz]
    # No version in the name: releases/latest/download/inua_linux_amd64.tar.gz
    # always fetches the newest (scripts/install.sh).
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - config/apps/*
      - config/session/*
      - scripts/inua-session
      - scripts/install-session.sh
      # inua-term's engine, built for each machine by release.yml
      - src: "lib/{{ .Arch }}/libinua-vt.so"
        dst: lib/inua
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^Merge"]

release:
  github:
    owner: lyricat
    name: inua
  footer: |
    Install: `curl -fsSL https://inua.one/install.sh | sh`
    Update: `inua upgrade`
