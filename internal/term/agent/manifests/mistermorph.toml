type = "mistermorph"
name = "Mister Morph"
icon = "agent-mistermorph"
process = ["mistermorph", "morph"] # as built from source, it is morph

# Asking: an approval fills the screen, its title at the top.
[[state]]
state = "blocked"
any = ["! Approval · ", "y approve · n deny"]

# Working: its footer's hint, "Esc/Ctrl+C stop", or "Ctrl+C stop" alone
# where the footer is too narrow for the whole hint.
[[state]]
state = "working"
lines = 3
any = ["Ctrl+C stop"]
