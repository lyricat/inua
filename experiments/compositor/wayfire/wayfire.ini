# Disposable nested profile for Wayfire 0.10.0; never install as user configuration.
[core]
plugins = ipc ipc-rules vswitch command autostart place move resize decoration
xwayland = false
vwidth = 3
vheight = 2

[autostart]
autostart_wf_shell = false
record_display = sh -c 'printf "%s\n" "$WAYLAND_DISPLAY" > "$FT68_RUN/display"'

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
